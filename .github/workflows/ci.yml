name: CI

on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**", "docs/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Python tests ──────────────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    env:
      # Tests use SQLite in-memory — no Postgres service needed
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      GEMINI_API_KEY: test-key-ci
      JWT_SECRET: ci-test-secret-that-is-32-chars!!
      REASONING_BACKEND: gemini

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run model and store tests
        run: pytest tests/test_models.py tests/test_store.py -v --tb=short

      - name: Run template tests (NBE + CBN)
        run: pytest tests/test_templates.py tests/test_cbn_templates.py -v --tb=short

      - name: Run auth tests
        run: pytest tests/test_auth.py -v --tb=short

      - name: Run Gemma engine tests (if present)
        run: |
          if [ -f tests/test_gemma_engine.py ]; then
            pytest tests/test_gemma_engine.py -v --tb=short
          else
            echo "test_gemma_engine.py not on this branch — skipping"
          fi

  # ── Java SDK tests ────────────────────────────────────────────────────────
  test-java:
    name: Java SDK Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run Java SDK tests
        working-directory: sdk-java
        run: mvn test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: sdk-java/target/surefire-reports/
