[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentauth"
version = "0.2.0"
description = "Open-source identity and authentication layer for AI agents, powered by Google Gemini"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kalkidan Dagnu", email = "kalajanegassykoki@gmail.com" }
]
keywords = ["ai", "agents", "authentication", "identity", "authorization", "gemini", "africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "google-generativeai==0.8.3",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "PyJWT[crypto]==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "aiosqlite==0.20.0",
]

[project.urls]
Homepage = "https://github.com/kibrnet/agentauth"
Repository = "https://github.com/kibrnet/agentauth"
Issues = "https://github.com/kibrnet/agentauth/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentauth*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
